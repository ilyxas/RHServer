openapi: 3.1.0
info:
  title: RemoteHands core API
  version: 0.3.0
  description: |
    HTTP API of rh-core (SPEC §4). Operations are added stage by stage; the
    signing scheme below applies to every operation unless it says otherwise.

    Every operation carries two extensions:
      x-rh-op   the `op` value that must appear in the signed object;
      x-rh-key  the key level the core requires (normal | critical | none).

    Signed request (SPEC §4.3):
      1. POST /v1/challenge -> nonce (32 bytes, single use, TTL 60 s).
      2. Signed object, canonical JSON per RFC 8785 (contracts/vectors/jcs.json):
         {"v":1,"device":"<id>","key":"normal|critical","nonce":"<base64>",
          "ts":"YYYY-MM-DDTHH:MM:SSZ","exp":"<ts + ≤60 s>","op":"<x-rh-op>",
          "body":"<sha256 hex of raw body bytes; sha256 of empty body for GET>"}
         Only strings and integers are allowed in it.
      3. X-RH-Auth = base64 (RFC 4648 §4, padded) of the canonical bytes;
         X-RH-Sig = base64 of the ECDSA P-256 / SHA-256 DER signature over them.
    Device public keys: X9.63 uncompressed (65 bytes), base64.
    Every core response, rejections included, carries X-RH-Server-Sig: DER
    signature by the core key over JCS
    {"v":1,"nonce":"<request nonce>","status":<HTTP status>,"body":"<sha256 hex>"}.
    For /v1/challenge the nonce is the issued one ("" when refused); for /v1/pair
    it is the pairing code. Vectors: contracts/vectors/server_sig.json.
    No bearer tokens or cookies.

    The core checks a signed request in this order and answers with the first
    failing code (contracts/vectors/signed_requests.json):
      malformed_auth, unknown_device, revoked_device, op_mismatch, wrong_key_level,
      bad_signature, nonce_unknown, nonce_used, nonce_expired, expired,
      clock_skew, body_mismatch.
    A nonce is consumed once the signature is valid and the nonce is a known,
    unused one for this device, even when a later check fails.

    HTTP status by code: 400 malformed_auth, bad_request; 401 op_mismatch, wrong_key_level,
    bad_signature, nonce_*, expired, clock_skew, body_mismatch; 403
    unknown_device, revoked_device, peer_mismatch, bad_pair_code, pair_rejected.
    The client shows "Pairing lost" for unknown_device, revoked_device and for a
    response whose X-RH-Server-Sig does not verify with the stored core key.

    Pairing string (QR, clipboard, launch argument -RHPairing):
      "rhpair:" + base64url without padding of
      JCS {"v":1,"url":"https://<MagicDNS>:8443","core_key":"<b64 X9.63>",
           "code":"<b64, ≥16 bytes>","exp":"<ts>"}
    Device id: first 32 hex of sha256(normal public key bytes).
    Fingerprint: first 16 hex of sha256(JCS {"normal","critical","ssh"} of the
    base64 keys), in groups of 4 separated by spaces; shown in the terminal and
    on the phone. Vectors: contracts/vectors/pairing.json.

    WebSocket frames (GET /v1/ws): {"seq":n,"payload":"<JSON text>","sig":"<b64>"};
    see contracts/api/events.schema.json and contracts/vectors/ws_frames.json.

    Reads that take parameters (data.get, log.list) are POST with a JSON body, so
    the parameters are covered by the signature through `body`. A signed request
    whose signature checks pass but whose body does not match the operation's
    schema is refused with 400 bad_request (stage 2 operations onwards).
servers:
  - url: https://{host}:8443
    description: Production core, Tailscale interface only
    variables:
      host:
        default: mac.tailnet.ts.net
        description: MagicDNS name of the owner's Mac
  - url: http://127.0.0.1:8787
    description: >-
      Dev mode (config only, never in a production install). 8787 by default, any
      free port when 8787 is taken; the pairing string carries the actual URL.
paths:
  /v1/challenge:
    post:
      operationId: challenge
      summary: Issue a single-use nonce for the next signed request
      description: Not signed (there is nothing to sign with yet). Refused for unknown and revoked devices (SPEC §4.5).
      x-rh-op: challenge
      x-rh-key: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device]
              properties:
                device: {$ref: "#/components/schemas/DeviceId"}
      responses:
        "200":
          description: Nonce issued. X-RH-Server-Sig signs it with nonce = the issued nonce.
          headers: {X-RH-Server-Sig: {$ref: "#/components/headers/ServerSig"}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [nonce, expires, server_time]
                properties:
                  nonce: {type: string, description: "32 random bytes, base64"}
                  expires: {$ref: "#/components/schemas/Timestamp"}
                  server_time: {$ref: "#/components/schemas/Timestamp"}
        "400": {$ref: "#/components/responses/Rejected"}
        "403": {$ref: "#/components/responses/Rejected"}
  /v1/pair:
    post:
      operationId: pair
      summary: Register this phone with a pairing code from `rhcore pair`
      description: |
        The signed object has op "pair", key "normal", nonce = the pairing code and
        device = device_id(keys.normal). It is signed twice: X-RH-Sig with the
        normal key and X-RH-Sig-Critical with the critical key. There is no
        challenge. The request stays open until the owner answers y/n in the terminal
        or the code expires (≤ 5 minutes): set the client timeout to at least 5
        minutes. With `replaces`, the old device is revoked by the same answer.
      x-rh-op: pair
      x-rh-key: normal+critical
      security:
        - rhAuth: []
          rhSig: []
          rhSigCritical: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, keys]
              properties:
                name: {type: string, minLength: 1, maxLength: 64, description: Device name shown in the terminal}
                keys:
                  type: object
                  additionalProperties: false
                  required: [normal, critical, ssh]
                  properties:
                    normal: {$ref: "#/components/schemas/PublicKey"}
                    critical: {$ref: "#/components/schemas/PublicKey"}
                    ssh: {$ref: "#/components/schemas/PublicKey"}
                replaces:
                  $ref: "#/components/schemas/DeviceId"
                  description: The device id this phone had before (kept in Keychain)
      responses:
        "200":
          description: Paired. X-RH-Server-Sig uses nonce = the pairing code and the core key from the pairing string.
          headers: {X-RH-Server-Sig: {$ref: "#/components/headers/ServerSig"}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [device_id, mac_name, ssh_host_keys]
                properties:
                  device_id: {$ref: "#/components/schemas/DeviceId"}
                  mac_name: {type: string}
                  ssh_host_keys:
                    type: array
                    description: OpenSSH public host key lines of the Mac's sshd (/etc/ssh/ssh_host_*_key.pub); may be empty
                    items: {type: string}
        "400": {$ref: "#/components/responses/Rejected"}
        "401": {$ref: "#/components/responses/Rejected"}
        "403": {$ref: "#/components/responses/Rejected"}
  /v1/ping:
    post:
      operationId: ping
      summary: Signed round trip
      x-rh-op: ping
      x-rh-key: normal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
              description: Send exactly the two bytes {}
      responses:
        "200":
          description: Pong
          headers: {X-RH-Server-Sig: {$ref: "#/components/headers/ServerSig"}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [pong, server_time]
                properties:
                  pong: {const: true}
                  server_time: {$ref: "#/components/schemas/Timestamp"}
        "400": {$ref: "#/components/responses/Rejected"}
        "401": {$ref: "#/components/responses/Rejected"}
        "403": {$ref: "#/components/responses/Rejected"}
  /v1/status:
    get:
      operationId: status
      summary: Core status for the status screen and the Home header
      x-rh-op: status
      x-rh-key: normal
      responses:
        "200":
          description: Status
          headers: {X-RH-Server-Sig: {$ref: "#/components/headers/ServerSig"}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mac_name, core_version, agent_version, mode, server_time]
                properties:
                  mac_name: {type: string}
                  core_version: {type: string}
                  agent_version:
                    type: [string, "null"]
                    description: Null until rh-agent exists (stage 3) or while it is not running
                  mode: {enum: [dev, production]}
                  server_time: {$ref: "#/components/schemas/Timestamp"}
        "400": {$ref: "#/components/responses/Rejected"}
        "401": {$ref: "#/components/responses/Rejected"}
        "403": {$ref: "#/components/responses/Rejected"}
  /v1/devices:
    get:
      operationId: devices.list
      summary: Paired devices for Settings → Devices
      x-rh-op: devices.list
      x-rh-key: normal
      responses:
        "200":
          description: Devices, newest first
          headers: {X-RH-Server-Sig: {$ref: "#/components/headers/ServerSig"}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, fingerprint, paired_at, status, current]
                      properties:
                        id: {$ref: "#/components/schemas/DeviceId"}
                        name: {type: string}
                        fingerprint: {type: string, pattern: "^[0-9a-f]{4}( [0-9a-f]{4}){3}$"}
                        paired_at: {$ref: "#/components/schemas/Timestamp"}
                        revoked_at: {$ref: "#/components/schemas/Timestamp"}
                        status: {enum: [active, revoked]}
                        current: {type: boolean, description: true for the device that sent this request}
        "400": {$ref: "#/components/responses/Rejected"}
        "401": {$ref: "#/components/responses/Rejected"}
        "403": {$ref: "#/components/responses/Rejected"}
  /v1/devices/revoke:
    post:
      operationId: devices.revoke
      summary: Revoke a device (Settings → Devices → Revoke)
      description: Its WebSocket connections are closed with code 4403. Revoking the current device is allowed.
      x-rh-op: devices.revoke
      x-rh-key: critical
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id]
              properties:
                device_id: {$ref: "#/components/schemas/DeviceId"}
      responses:
        "200":
          description: Revoked (also when it already was)
          headers: {X-RH-Server-Sig: {$ref: "#/components/headers/ServerSig"}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [device_id, status]
                properties:
                  device_id: {$ref: "#/components/schemas/DeviceId"}
                  status: {const: revoked}
        "400": {$ref: "#/components/responses/Rejected"}
        "401": {$ref: "#/components/responses/Rejected"}
        "403": {$ref: "#/components/responses/Rejected"}
        "404":
          description: No such device
          headers: {X-RH-Server-Sig: {$ref: "#/components/headers/ServerSig"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotFound"}
  /v1/ws:
    get:
      operationId: ws.open
      summary: Open the event WebSocket
      description: |
        WebSocket upgrade carrying X-RH-Auth / X-RH-Sig for op "ws.open" (empty
        body). The connection belongs to the signing device. Frames are signed
        with the ws.open nonce, see contracts/api/events.schema.json. The first
        frame is "hello". Close code 4403: the device was revoked.
      x-rh-op: ws.open
      x-rh-key: normal
      responses:
        "101": {description: Switching protocols}
        "400": {$ref: "#/components/responses/Rejected"}
        "401": {$ref: "#/components/responses/Rejected"}
        "403": {$ref: "#/components/responses/Rejected"}
  /v1/data:
    post:
      operationId: data.get
      summary: Current values of data sources (Home, pages)
      description: |
        One call returns a batch of data_id values. Built-in sources (SPEC §5.4)
        are always `active`:

          sys.cpu        number, unit "%"      CPU load of the whole Mac, 0..100
          sys.memory     number, unit "%"      memory in use, 0..100
          sys.disk_free  number, unit "bytes"  free space on the startup volume
                                               (integer; the client formats it as
                                               "112 GB free")
          rh.status      status   core and agent alive; text names the versions
          rh.approvals   rows     approvals waiting for the owner, oldest first;
                                  row id = approval_id (always [] until stage 4)
          rh.questions   rows     questions of the agent waiting for an answer in
                                  Chat (always [] until stage 3)
          rh.activity    rows     the 10 newest log.list entries of filter "all"
                                  (Home "Last Activity"): row id = log entry id,
                                  title, subtitle = detail, at = entry ts
          agents.status  rows     the team from ~/Friend/CLAUDE.md, in file order:
                                  id and title = agent id, subtitle = its role,
                                  status.text = working | idle | monitoring |
                                  stopped | unknown; status.state = ok for working
                                  and monitoring, off for the rest

        Values are raw; rounding and units on screen are the client's. A data_id
        that is not built in and not registered (stage 5) is `pending`, which is
        not an error (SPEC §7.5). A source that failed this time is `error` with
        a message; the other values in the batch are still returned.
      x-rh-op: data.get
      x-rh-key: normal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 32
                  uniqueItems: true
                  items: {$ref: "#/components/schemas/DataId"}
            example: {ids: [sys.cpu, sys.memory, sys.disk_free, rh.approvals, agents.status]}
      responses:
        "200":
          description: One value per requested id
          headers: {X-RH-Server-Sig: {$ref: "#/components/headers/ServerSig"}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [values, server_time]
                properties:
                  values:
                    type: object
                    description: Keys are exactly the requested ids
                    propertyNames: {$ref: "#/components/schemas/DataId"}
                    additionalProperties: {$ref: "#/components/schemas/DataResult"}
                  server_time: {$ref: "#/components/schemas/Timestamp"}
              example:
                values:
                  sys.cpu: {status: active, type: number, value: 38.4, unit: "%", at: "2026-10-19T12:00:00Z"}
                  sys.memory: {status: active, type: number, value: 61.2, unit: "%", at: "2026-10-19T12:00:00Z"}
                  sys.disk_free: {status: active, type: number, value: 112400000000, unit: bytes, at: "2026-10-19T12:00:00Z"}
                  rh.approvals: {status: active, type: rows, value: [], at: "2026-10-19T12:00:00Z"}
                  agents.status:
                    status: active
                    type: rows
                    at: "2026-10-19T12:00:00Z"
                    value:
                      - {id: Friend, title: Friend, subtitle: observer, status: {state: ok, text: monitoring}}
                      - {id: RemoteHands, title: RemoteHands, subtitle: executor on the Mac, status: {state: "off", text: unknown}}
                  render.queue: {status: pending}
                server_time: "2026-10-19T12:00:00Z"
        "400": {$ref: "#/components/responses/Rejected"}
        "401": {$ref: "#/components/responses/Rejected"}
        "403": {$ref: "#/components/responses/Rejected"}
  /v1/log:
    post:
      operationId: log.list
      summary: The Log tab feed, newest first (SPEC §8.5)
      description: |
        Built from the core journal (and, from stage 3, chat messages). Every
        entry has a kind; the filter picks kinds:

          all        every entry below
          commands   kind command: what changed, written when it happens:
                     pairing, device revoked (later: action calls, registrations,
                     page changes, chat stop / reset)
          approvals  kind approval (stage 4)
          chat       kind chat (stage 3): one entry per message, title = author
                     ("owner" or "RemoteHands"), detail = text
          errors     kind error: rejected requests, rejected pairing, failures

        Kind system (core started / stopped and the like) shows only under all.
        Accepted requests stay in the journal file but are not in the feed by
        default: reads (ping, status, devices.list, data.get, log.list,
        quick.list, ws.open) are noise, and for a command the feed shows its
        effect instead of the request (one entry "Revoked Мой iPhone", not two).
        With include_reads: true they are in the feed too, as kind system
        (title "Accepted <op>"), under filter all.

        `query` is a case-insensitive substring match over title, detail, event,
        op and device. `before` is the `next` value of the previous page; pages
        do not shift when new entries arrive. Pull-to-refresh omits `before`.
      x-rh-op: log.list
      x-rh-key: normal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                filter: {enum: [all, commands, approvals, chat, errors], default: all}
                query: {type: string, maxLength: 200}
                before: {type: string, description: Opaque cursor from `next`}
                limit: {type: integer, minimum: 1, maximum: 200, default: 50}
                include_reads: {type: boolean, default: false, description: Also list accepted requests (kind system)}
            example: {filter: errors, query: ping, limit: 50}
      responses:
        "200":
          description: A page of entries
          headers: {X-RH-Server-Sig: {$ref: "#/components/headers/ServerSig"}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [entries, next]
                properties:
                  entries:
                    type: array
                    items: {$ref: "#/components/schemas/LogEntry"}
                  next:
                    type: [string, "null"]
                    description: Cursor for the next (older) page; null when there is none
              example:
                entries:
                  - id: 9b1f6c0e5a7d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f
                    ts: "2026-10-19T12:00:05Z"
                    kind: error
                    event: request
                    title: "Rejected ping: bad_signature"
                    detail: signature does not verify
                    device: 3f2a9c0d1e4b5a6f7081928374655647
                    op: ping
                  - id: 1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d
                    ts: "2026-10-19T11:58:00Z"
                    kind: command
                    event: pairing
                    title: "Paired Мой iPhone"
                    detail: "fingerprint 3f2a 9c0d 1e4b 5a6f"
                    device: 3f2a9c0d1e4b5a6f7081928374655647
                next: "MjAyNjEwMTk6MTI"
        "400": {$ref: "#/components/responses/Rejected"}
        "401": {$ref: "#/components/responses/Rejected"}
        "403": {$ref: "#/components/responses/Rejected"}
  /v1/quick:
    get:
      operationId: quick.list
      summary: Quick Access on Home (SPEC §8.2)
      description: Pinned pages and actions in the owner's order. Always empty until stage 5 adds quick.pin / quick.unpin.
      x-rh-op: quick.list
      x-rh-key: normal
      responses:
        "200":
          description: Pinned items
          headers: {X-RH-Server-Sig: {$ref: "#/components/headers/ServerSig"}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/QuickItem"}
              example: {items: []}
        "400": {$ref: "#/components/responses/Rejected"}
        "401": {$ref: "#/components/responses/Rejected"}
        "403": {$ref: "#/components/responses/Rejected"}
  /v1/friend:
    post:
      operationId: friend.send
      summary: A message from the owner to the Friend session
      description: |
        The core checks the request like any signed operation, then keeps it exactly
        as received (X-RH-Auth, X-RH-Sig and the body bytes) in its friend inbox
        under spool_id = first 32 hex of sha256(nonce). A bridge types only the line
        `⟦rh:<spool_id>⟧` into the Friend session; the Friend verifier loads the
        envelope and re-checks the phone's signature against the device list the core
        exports, signed by the core key. Nothing on the way can turn a message into a
        verified one. Vectors: vectors/friend.json.

        The body is JSON {"id","text","to"}: `to` is "Friend", `id` is the phone's
        message id (1–64 of A-Z a-z 0-9 -), `text` has 1–8000 characters. A body that does not
        fit is refused with bad_request.
      x-rh-op: friend.send
      x-rh-key: normal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, text, to]
              properties:
                id: {type: string, pattern: "^[A-Za-z0-9-]{1,64}$"}
                text: {type: string, minLength: 1, maxLength: 8000}
                to: {type: string, const: Friend}
            example: {id: m-1, text: "check the build", to: Friend}
      responses:
        "200":
          description: Accepted and handed to the Friend inbox
          headers: {X-RH-Server-Sig: {$ref: "#/components/headers/ServerSig"}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, message_id, accepted_at]
                properties:
                  id: {type: string, pattern: "^[0-9a-f]{32}$", description: spool_id}
                  message_id: {type: string}
                  accepted_at: {$ref: "#/components/schemas/Timestamp"}
              example:
                id: 2f6c0d1e4b5a6f708192837465564700
                message_id: m-1
                accepted_at: "2026-10-23T03:12:05Z"
        "400": {$ref: "#/components/responses/Rejected"}
        "401": {$ref: "#/components/responses/Rejected"}
        "403": {$ref: "#/components/responses/Rejected"}
components:
  headers:
    ServerSig:
      description: Base64 DER signature by the core key; see info.description.
      required: true
      schema: {type: string}
  responses:
    Rejected:
      description: Request refused; the code says why (also written to the core journal).
      headers: {X-RH-Server-Sig: {$ref: "#/components/headers/ServerSig"}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    DeviceId:
      type: string
      pattern: "^[0-9a-f]{32}$"
      description: First 32 hex of sha256(normal public key)
    PublicKey:
      type: string
      description: Base64 of a 65-byte X9.63 uncompressed P-256 point
    Timestamp:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
      description: UTC, whole seconds
    DataId:
      type: string
      maxLength: 64
      pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
      description: data_id, e.g. sys.cpu or render.queue
    StatusValue:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {enum: [ok, warn, error, "off"]}
        text: {type: string}
      description: Value of type status (SPEC §7.3)
    Row:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: {type: string}
        title: {type: string}
        subtitle: {type: string}
        status: {$ref: "#/components/schemas/StatusValue"}
        at: {$ref: "#/components/schemas/Timestamp", description: "When the row's event happened, if it has one"}
      description: One element of a value of type rows (SPEC §7.3, plus optional at)
    DataResult:
      oneOf:
        - $ref: "#/components/schemas/DataActive"
        - $ref: "#/components/schemas/DataPending"
        - $ref: "#/components/schemas/DataError"
      discriminator:
        propertyName: status
        mapping:
          active: "#/components/schemas/DataActive"
          pending: "#/components/schemas/DataPending"
          error: "#/components/schemas/DataError"
    DataActive:
      type: object
      additionalProperties: false
      required: [status, type, value, at]
      properties:
        status: {const: active}
        type: {enum: [number, string, bool, status, rows, text]}
        value: {description: "Shape set by type, see allOf"}
        unit: {type: string, description: "Only for type number, e.g. \"%\" or \"bytes\""}
        at: {$ref: "#/components/schemas/Timestamp", description: "When the value was read"}
      allOf:
        - if: {properties: {type: {const: number}}}
          then: {properties: {value: {type: number}}}
        - if: {properties: {type: {const: string}}}
          then: {properties: {value: {type: string}}}
        - if: {properties: {type: {const: bool}}}
          then: {properties: {value: {type: boolean}}}
        - if: {properties: {type: {const: status}}}
          then: {properties: {value: {$ref: "#/components/schemas/StatusValue"}}}
        - if: {properties: {type: {const: rows}}}
          then: {properties: {value: {type: array, items: {$ref: "#/components/schemas/Row"}}}}
        - if: {properties: {type: {const: text}}}
          then: {properties: {value: {type: string}}}
        - if: {not: {properties: {type: {const: number}}}}
          then: {not: {required: [unit]}}
    DataPending:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {const: pending}
      description: Not built in and not registered (yet); the element shows as pending
    DataError:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status: {const: error}
        message: {type: string}
    LogEntry:
      type: object
      additionalProperties: false
      required: [id, ts, kind, event, title]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: sha256 hex of the journal line (the next line's `prev`)
        ts: {$ref: "#/components/schemas/Timestamp"}
        kind: {enum: [command, approval, chat, error, system]}
        event: {type: string, description: "Journal event, e.g. request, pairing, device.revoked"}
        title: {type: string, description: One line, English, ready to show}
        detail: {type: string}
        device: {$ref: "#/components/schemas/DeviceId"}
        op: {type: string}
    QuickItem:
      type: object
      additionalProperties: false
      required: [kind, id, title]
      properties:
        kind: {enum: [page, action]}
        id: {type: string, description: page id or action_id}
        title: {type: string}
        icon: {type: string, description: SF Symbol name}
    NotFound:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {const: not_found}
            message: {type: string}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Human readable reason, also written to the core journal.
    ErrorCode:
      type: string
      description: Machine readable rejection reason (SPEC §4.3).
      enum:
        - malformed_auth
        - unknown_device
        - revoked_device
        - wrong_key_level
        - op_mismatch
        - nonce_unknown
        - nonce_used
        - nonce_expired
        - expired
        - clock_skew
        - body_mismatch
        - bad_signature
        - bad_pair_code
        - pair_rejected
        - peer_mismatch
        - bad_request
  securitySchemes:
    rhAuth:
      type: apiKey
      in: header
      name: X-RH-Auth
      description: Base64 of the canonical signed object; see info.description.
    rhSig:
      type: apiKey
      in: header
      name: X-RH-Sig
      description: Base64 DER signature over the bytes carried in X-RH-Auth.
    rhSigCritical:
      type: apiKey
      in: header
      name: X-RH-Sig-Critical
      description: Pairing only. Base64 DER signature by the critical key over the same bytes.
security:
  - rhAuth: []
    rhSig: []
